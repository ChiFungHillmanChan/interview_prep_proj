{% extends 'prep_app/base.html' %} 
{% load static %} 

{% block content %}
{% csrf_token %}

{% if show_progress_bar %}{% endif %}

<!-- Results content below is used for immediate render -->

<div id="cv-analysis-container">
<script>
  // Function to generate results HTML
  const generateResultsHTML = (analysis, jobRole, companyName) => {
    // Generate keywords HTML
    const keywordsHTML = analysis.keywords.slice(0, 10).map(keyword => `
      <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
        <span class="text-gray-700 font-medium">${keyword.word}</span>
        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-sm">${keyword.count}</span>
      </div>
    `).join('');

    // Determine match score color and message
    const matchScore = analysis.match_score;
    let scoreColor, scoreBg, scoreMessage;
    
    if (matchScore >= 80) {
      scoreColor = 'text-green-600';
      scoreBg = 'bg-green-100';
      scoreMessage = 'Excellent Match!';
    } else if (matchScore >= 60) {
      scoreColor = 'text-blue-600';  
      scoreBg = 'bg-blue-100';
      scoreMessage = 'Good Match';
    } else if (matchScore >= 40) {
      scoreColor = 'text-yellow-600';
      scoreBg = 'bg-yellow-100';
      scoreMessage = 'Moderate Match';
    } else {
      scoreColor = 'text-red-600';
      scoreBg = 'bg-red-100';
      scoreMessage = 'Needs Improvement';
    }

    // Find matched skills (skills that appear in both job requirements and CV)
    const jobSkills = analysis.job_skills.map(skill => skill.toLowerCase());
    const cvSkills = analysis.cv_skills.map(skill => skill.toLowerCase());
    
    const matchedSkills = analysis.cv_skills.filter(skill => 
      jobSkills.includes(skill.toLowerCase())
    );
    
    const unMatchedJobSkills = analysis.job_skills.filter(skill => 
      !cvSkills.includes(skill.toLowerCase())
    );

    const additionalCvSkills = analysis.cv_skills.filter(skill => 
      !jobSkills.includes(skill.toLowerCase())
    );

    // Categorize skills by type (basic categorization)
    const categorizeSkills = (skills) => {
      const categories = {
        'Technical Skills': [],
        'Programming Languages': [],
        'Tools & Frameworks': [],
        'Soft Skills': [],
        'Other': []
      };

      const techKeywords = ['programming', 'development', 'software', 'database', 'system', 'network', 'security', 'analysis'];
      const langKeywords = ['javascript', 'python', 'java', 'c++', 'html', 'css', 'sql', 'react', 'angular', 'node'];
      const toolKeywords = ['git', 'docker', 'kubernetes', 'aws', 'azure', 'jenkins', 'jira', 'figma'];
      const softKeywords = ['communication', 'leadership', 'teamwork', 'problem', 'management', 'creative'];

      skills.forEach(skill => {
        const skillLower = skill.toLowerCase();
        if (langKeywords.some(keyword => skillLower.includes(keyword))) {
          categories['Programming Languages'].push(skill);
        } else if (toolKeywords.some(keyword => skillLower.includes(keyword))) {
          categories['Tools & Frameworks'].push(skill);
        } else if (softKeywords.some(keyword => skillLower.includes(keyword))) {
          categories['Soft Skills'].push(skill);
        } else if (techKeywords.some(keyword => skillLower.includes(keyword))) {
          categories['Technical Skills'].push(skill);
        } else {
          categories['Other'].push(skill);
        }
      });

      return categories;
    };

    const matchedCategories = categorizeSkills(matchedSkills);
    const missingCategories = categorizeSkills(unMatchedJobSkills);

    const generateCategoryHTML = (categories, colorClass) => {
      return Object.entries(categories)
        .filter(([category, skills]) => skills.length > 0)
        .map(([category, skills]) => `
          <div class="mb-3">
            <h4 class="text-sm font-medium text-gray-600 mb-1">${category}</h4>
            <div class="flex flex-wrap gap-1">
              ${skills.map(skill => `<span class="inline-block ${colorClass} px-2 py-1 rounded-md text-xs font-medium">${skill}</span>`).join('')}
            </div>
          </div>
        `).join('');
    };

    return `
      <!-- Header Section -->
      <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white pt-8 pb-8 -mt-8">
        <div class="container mx-auto px-4">
          <div class="text-center">
            <h1 class="text-4xl font-bold mb-2">CV Analysis Results</h1>
            <p class="text-xl text-blue-100">
              Analysis for <span class="font-semibold">${jobRole}</span> position at <span class="font-semibold">${companyName}</span>
            </p>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="bg-gray-50 py-8 min-h-screen">
        <div class="container mx-auto px-4 max-w-6xl">
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column - Keywords & Score -->
            <div class="lg:col-span-1 space-y-6">
              <!-- Match Score -->
              <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H9a2 2 0 01-2-2z"></path>
                  </svg>
                  Overall Match Score
                </h2>
                <div class="text-center">
                  <div class="relative w-32 h-32 mx-auto mb-4">
                    <div class="w-full h-full ${scoreBg} rounded-full flex items-center justify-center border-4 border-white shadow-lg">
                      <span class="text-3xl font-bold ${scoreColor}">${matchScore}%</span>
                    </div>
                  </div>
                  <p class="text-lg font-semibold ${scoreColor}">${scoreMessage}</p>
                </div>
              </div>

              <!-- Keywords -->
              <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path>
                  </svg>
                  Key Terms from Job Description
                </h2>
                <div class="space-y-3">${keywordsHTML}</div>
              </div>
            </div>

            <!-- Right Column - Skills Analysis -->
            <div class="lg:col-span-2">
              <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-6 text-gray-800 flex items-center">
                  <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  Skills Analysis by Category
                </h2>
                
                <div class="space-y-6">
                  <!-- Matched Skills -->
                  <div class="border-l-4 border-green-500 pl-4">
                    <h3 class="text-lg font-medium text-green-700 mb-3 flex items-center">
                      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                      </svg>
                      Skills You Match (${matchedSkills.length} skills)
                    </h3>
                    ${generateCategoryHTML(matchedCategories, 'bg-green-100 text-green-800')}
                  </div>

                  <!-- Missing Skills -->
                  <div class="border-l-4 border-red-500 pl-4">
                    <h3 class="text-lg font-medium text-red-700 mb-3 flex items-center">
                      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                      </svg>
                      Skills to Develop (${unMatchedJobSkills.length} skills)
                    </h3>
                    ${generateCategoryHTML(missingCategories, 'bg-red-100 text-red-800')}
                  </div>

                  <!-- Additional Skills -->
                  ${additionalCvSkills.length > 0 ? `
                  <div class="border-l-4 border-blue-500 pl-4">
                    <h3 class="text-lg font-medium text-blue-700 mb-3 flex items-center">
                      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                      </svg>
                      Additional Skills You Have (${additionalCvSkills.length} skills)
                    </h3>
                    <div class="flex flex-wrap gap-1">
                      ${additionalCvSkills.map(skill => `<span class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded-md text-xs font-medium">${skill}</span>`).join('')}
                    </div>
                  </div>
                  ` : ''}

                  <!-- Action Items -->
                  <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <h3 class="text-lg font-medium text-yellow-800 mb-2 flex items-center">
                      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      Recommendations
                    </h3>
                    <ul class="text-sm text-yellow-700 space-y-1">
                      <li>• Focus on developing the missing skills highlighted above</li>
                      <li>• Consider adding relevant projects that demonstrate these skills</li>
                      <li>• Update your CV to better highlight your matching skills</li>
                      ${matchScore < 60 ? '<li>• Consider gaining experience in the key areas mentioned in the job description</li>' : ''}
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- Actions -->
          <div class="mt-8 text-center">
            <a href="/cv-analysis/" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors mr-4">
              Analyze Another CV
            </a>
            <button onclick="window.print()" class="bg-gray-600 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition-colors">
              Print Results
            </button>
          </div>
        </div>
      </div>
    `;
  };

  // Immediately render results using context passed from server
  const analysisData = JSON.parse('{{ analysis_json|escapejs }}');
  document.getElementById('cv-analysis-container').innerHTML = generateResultsHTML(analysisData, '{{ job_role }}', '{{ company_name }}');
</script>
</div>

{% endblock %}
