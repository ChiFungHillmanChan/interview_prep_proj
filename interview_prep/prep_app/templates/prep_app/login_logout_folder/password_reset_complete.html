{% extends 'prep_app/base.html' %}
{% block title %}Password reset complete - AceInterview{% endblock %}
{% block content %}
<main class="min-h-screen bg-gray-50 px-6 py-16">
  <section class="mx-auto max-w-md rounded-xl bg-white p-8 text-center shadow-sm ring-1 ring-gray-100">
    <h1 class="text-2xl font-bold text-gray-900">Password reset complete</h1>
    <p class="mt-3 text-gray-600">Your password has been updated. You can now sign in securely.</p>
    <a class="mt-6 inline-block rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white" href="{% url 'login' %}">Sign in</a>
  </section>
</main>
{% endblock %}
